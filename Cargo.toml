[package]
name = "live-server"
version = "0.0.1-alpha"
edition = "2024"
description = "A fast Rust live development server for frontend projects"
license = "MIT"
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
mime_guess = "2.0.5"
notify = "8.2.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
