<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jQuery + AJAX test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>jQuery + AJAX</h1>
    <p id="jquery-status">Loading jQuery…</p>
    <pre id="ajax-status">Waiting for AJAX…</pre>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function () {
      $("#jquery-status").text("jQuery loaded ✅");
      $.ajax({ url: "/api/data.json", dataType: "json" })
        .done(function (data) {
          $("#ajax-status").text(JSON.stringify(data, null, 2));
        })
        .fail(function (xhr) {
          $("#ajax-status").text("AJAX failed: " + xhr.status);
        });
    });
  </script>
</body>
</html>
